name: OpenWrt Snapshot Build for Jio AX6000 (JIDU6J11)

on:
  push:
    branches:
      - integrate/latest-main-five-patches-qcn-bdf-validated
      - experiment/jidu6j11-ahb-rss-rps-cake-mq-26177
      - experiment/jidu6j11-remote-streaming-wan-shaping
      - experiment/jidu6j11-remote-streaming-ath11k-pagepool
    # Workflow-only maintenance commits must not start an expensive image build.
    paths-ignore:
      - ".github/workflows/build.yml"
      - ".github/workflows/preflight.yml"
      - "scripts/prepare.sh"
      - "patches/iwinfo/**"
      - "scripts/verify-patch-series.py"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if nothing changed"
        type: boolean
        default: false
  schedule:
    - cron: "30 20 * * *" # 02:00 IST, daily

permissions:
  contents: write

env:
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  OPENWRT_BRANCH: main
  OPENWRT_COMMIT: "eb54de199ffd2e81d743f4ca580f561471e586f5"
  PR_NUMBER: "26498"
  PR_COMMIT: "727ed7916a1df588a5a325119e837fec5483c062"
  PACKAGES_COMMIT: "074500b953d27131881f6cb2f37edbb86be985ba"
  TARGET: qualcommbe
  SUBTARGET: ipq95xx
  SKUS: "6111 6411 6611 6711 6811 6911"
  EXPECTED_DEVICES: "6"
  KEEP_RELEASES: "7"

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      hash: ${{ steps.check.outputs.hash }}
      openwrt_sha: ${{ steps.check.outputs.openwrt_sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Decide whether a build is needed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          up="${OPENWRT_COMMIT:-$(git ls-remote "$OPENWRT_REPO" "refs/heads/$OPENWRT_BRANCH" | cut -f1)}"
          if [ -z "$up" ]; then
            echo "::error::Could not resolve OpenWrt branch $OPENWRT_BRANCH"
            exit 1
          fi
          pr="${PR_COMMIT:-}"
          if [ -z "$pr" ] && [ -n "$PR_NUMBER" ]; then
            pr=$(git ls-remote "$OPENWRT_REPO" "refs/pull/$PR_NUMBER/head" | cut -f1)
          fi
          # Hash every active feed revision too. OpenWrt main, LuCI, routing,
          # telephony and video feeds can advance independently of main.
          feeds_conf=$(mktemp)
          curl -fsSL "https://raw.githubusercontent.com/openwrt/openwrt/$up/feeds.conf.default" -o "$feeds_conf"
          for f in feeds.conf.default.d/*; do
            [ -f "$f" ] || continue
            cat "$f" >> "$feeds_conf"
          done
          feed_versions=""
          while read -r feed_type feed_name feed_url _; do
            case "$feed_type" in
              src-git|src-git-full)
                if [ "$feed_name" = "packages" ] && [ -n "$PACKAGES_COMMIT" ]; then
                  feed_rev="$PACKAGES_COMMIT"
                elif [[ "$feed_url" == *^* ]]; then
                  feed_rev="${feed_url##*^}"
                else
                  feed_remote="$feed_url"
                  feed_branch=""
                  if [[ "$feed_url" == *";branch="* ]]; then
                    feed_remote="${feed_url%%;branch=*}"
                    feed_branch="${feed_url##*;branch=}"
                  fi
                  if [ -n "$feed_branch" ]; then
                    feed_rev=$(git ls-remote "$feed_remote" "refs/heads/$feed_branch" | cut -f1)
                  else
                    feed_rev=$(git ls-remote "$feed_remote" HEAD | cut -f1)
                  fi
                fi
                if [ -z "$feed_rev" ]; then
                  echo "::error::Could not resolve revision for feed $feed_name ($feed_url)"
                  exit 1
                fi
                feed_versions="$feed_versions $feed_name=$feed_rev"
                ;;
            esac
          done < "$feeds_conf"
          rm -f "$feeds_conf"

          own=$(git ls-tree -r HEAD -- config patches files bdf feeds.conf.default.d scripts .github | sha256sum | cut -d' ' -f1)
          hash=$(printf '%s\n' "$up" "$pr" "$feed_versions" "$own" | sha256sum | cut -c1-16)

          last=$(gh release view --json body -q .body 2>/dev/null | sed -n 's/.*Build-Hash: //p' | head -n1 || true)
          echo "current=$hash last=$last"

          if [ "$hash" != "$last" ] || [ "$FORCE" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "openwrt_sha=$up" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force > /dev/null
        df -h /

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gettext git \
          libncurses-dev libssl-dev python3-setuptools python3-pyelftools rsync swig \
          unzip zlib1g-dev file wget libelf-dev ccache tree

    - name: Restore caches
      uses: actions/cache/restore@v4
      with:
        path: |
          cache/dl
          cache/ccache
          cache/npm
        key: openwrt-cache-v2-${{ runner.os }}-${{ env.TARGET }}-${{ env.SUBTARGET }}-${{ hashFiles('config/base.diffconfig', 'config/extra-packages.txt', 'patches/**', 'bdf/**', 'feeds.conf.default.d/**') }}-${{ github.run_id }}
        # Reuse the same config first, then the latest cache for this target.
        # ccache validates compiler identity before reusing cached objects.
        restore-keys: |
          openwrt-cache-v2-${{ runner.os }}-${{ env.TARGET }}-${{ env.SUBTARGET }}-${{ hashFiles('config/base.diffconfig', 'config/extra-packages.txt', 'patches/**', 'bdf/**', 'feeds.conf.default.d/**') }}-
          openwrt-cache-v2-${{ runner.os }}-${{ env.TARGET }}-${{ env.SUBTARGET }}-
          build-cache-

    - name: Set up Node.js for UnTangled build
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Prepare tree
      env:
        OPENWRT_COMMIT: ${{ needs.check.outputs.openwrt_sha }}
      run: bash scripts/prepare.sh

    - name: Download sources
      working-directory: openwrt
      run: make download -j8

    - name: Validate kernel and ath11k sources (no compilation)
      working-directory: openwrt
      run: |
        # Source downloads have already completed above; prepare source packages
        # without compiling kernel or driver objects.
        make package/network/utils/iwinfo/prepare V=s
        iwinfo_src=$(find build_dir/target-* -type f -path '*/libiwinfo-*/devices.txt' -print -quit)
        if [ -z "$iwinfo_src" ] || ! grep -Fq '"qcom,ipq9574-wifi"' "$iwinfo_src"; then
          echo "::error::Prepared libiwinfo source is missing the pinned IPQ9574 device identifier"
          exit 1
        fi

        python3 ../scripts/verify-patch-series.py ../patches/ath11k
        make package/kernel/mac80211/prepare V=s

        src=$(find build_dir/target-* -type d -path '*/mac80211-regular/backports-7.2' -print -quit)
        if [ -z "$src" ]; then
          echo "::error::Prepared mac80211 backports source directory was not found"
          exit 1
        fi

        # The ath11k retry/statistics backport changes the mac80211 package
        # revision; assert the bump before compilation so stale kmod packages
        # cannot be produced from the patched source.
        if ! grep -Fq 'PKG_RELEASE:=22' package/kernel/mac80211/Makefile; then
          echo "::error::mac80211 PKG_RELEASE must be 22 for the integrated ath11k patches"
          exit 1
        fi

        # Verify the patched driver source and its mac80211 scheduling dependency.
        bash ../scripts/verify-ath11k-patches.sh "$src"
        bash ../scripts/verify-ath11k-patch-application.sh "$src" "$PWD"

        # Verify that netifd discovers the EDMA ethernet-dma child and steers
        # only RX descriptor IRQs (not TX completion or RX fill IRQs).
        bash ../scripts/verify-netifd-packet-steering.sh \
          package/network/config/netifd/files/usr/libexec/network/packet-steering.uc \
          package/network/config/netifd/files/etc/hotplug.d/net/20-packet-steering \
          package/network/config/netifd/Makefile

        # Apply the target kernel patch series without compiling the kernel,
        # then verify the EDMA completion-ring queue-wakeup fix is present.
        make target/linux/prepare V=s
        edma_tx=$(find build_dir/target-* -type f \
          -path '*/drivers/net/ethernet/qualcomm/ppe/edma_tx.c' -print -quit)
        if [ -z "$edma_tx" ]; then
          echo "::error::Prepared Qualcomm EDMA TX source was not found"
          exit 1
        fi
        bash ../scripts/verify-edma-tx-queue-wake.sh "$edma_tx"

        edma=$(find build_dir/target-* -type f \
          -path '*/drivers/net/ethernet/qualcomm/ppe/edma.c' -print -quit)
        if [ -z "$edma" ]; then
          echo "::error::Prepared Qualcomm EDMA source was not found"
          exit 1
        fi
        # Verify RX ring IRQ distribution and cleanup. TX completion IRQ
        # placement remains unchanged until device-level benchmarks justify it.
        bash ../scripts/verify-edma-rx-irq-affinity.sh "$edma"
        bash ../scripts/verify-edma-napi.sh "$(dirname "$edma")"

        cake_src=$(find build_dir/target-* -type f \
          -path '*/net/sched/sch_cake.c' -print -quit)
        if [ -z "$cake_src" ]; then
          echo "::error::Prepared sch_cake.c source was not found"
          exit 1
        fi
        bash ../scripts/verify-cake-patches.sh "$cake_src"

        echo "::notice::Pre-build patch validation passed; no compilation performed"

    - name: Build
      id: build
      working-directory: openwrt
      env:
        BUILD_TIME_LOG: build-time.log
        CCACHE_DIR: ${{ github.workspace }}/cache/ccache
      shell: bash
      run: |
        set -o pipefail
        set +e
        make -j"$(($(nproc) + 1))" 2>&1 | tee ../openwrt-build.log
        build_rc=${PIPESTATUS[0]}
        if [ "$build_rc" -eq 0 ]; then
          exit 0
        fi

        if ! grep -Fq 'ERROR: package/libs/libubox [host] failed to build.' ../openwrt-build.log; then
          echo "::error::OpenWrt build failed (exit $build_rc); failure was not the libubox host target."
          exit "$build_rc"
        fi

        echo "::warning::libubox host failed in the parallel build; retrying only that host target serially with verbose output."
        make -j1 package/libs/libubox/host/compile V=s 2>&1 | tee ../libubox-host-diagnostic.log
        host_rc=${PIPESTATUS[0]}
        if [ "$host_rc" -ne 0 ]; then
          echo "::error::Serial verbose libubox host retry failed (exit $host_rc); see libubox-host-diagnostic.log."
          exit "$build_rc"
        fi

        echo "::notice::Serial libubox host retry passed; resuming the full OpenWrt build."
        set -e
        make -j"$(($(nproc) + 1))" 2>&1 | tee -a ../openwrt-build.log
    - name: Save caches
      if: always()
      uses: actions/cache/save@v4
      with:
        path: |
          cache/dl
          cache/ccache
          cache/npm
        key: openwrt-cache-v2-${{ runner.os }}-${{ env.TARGET }}-${{ env.SUBTARGET }}-${{ hashFiles('config/base.diffconfig', 'config/extra-packages.txt', 'patches/**', 'bdf/**', 'feeds.conf.default.d/**') }}-${{ github.run_id }}

    - name: Build Summary
      if: always()
      run: |
        if [ ! -d openwrt ]; then
          echo "::warning::OpenWrt tree was not prepared; skipping summary so the original failure remains visible."
          exit 0
        fi
        cd openwrt
        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  Runner Info"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  OS      : $(lsb_release -ds)"
        echo "  CPU     : $(nproc) cores"
        echo "  RAM     : $(free -h | awk '/^Mem/{print $2}') total / $(free -h | awk '/^Mem/{print $7}') available"
        echo "  Disk    : $(df -h . | awk 'NR==2{print $4}') free of $(df -h . | awk 'NR==2{print $2}')"
        echo ""
        echo "  Build target: $(grep 'CONFIG_TARGET_BOARD' .config | cut -d= -f2 | tr -d '\"') / $(grep 'CONFIG_TARGET_SUBTARGET' .config | cut -d= -f2 | tr -d '\"')"
        grep -E '^CONFIG_TARGET_DEVICE_.*=y' .config | sed -E 's/.*_DEVICE_(.*)=y/  - \1/'
        echo ""
        git log --oneline -5
        echo ""
        echo "  OpenWrt source revision"
        cat ../build-info.env
        echo ""
        ls -1 bin/targets/$TARGET/$SUBTARGET/ 2>/dev/null || true
        ls -lh bin/targets/$TARGET/$SUBTARGET/*sysupgrade* bin/targets/$TARGET/$SUBTARGET/*initramfs* 2>/dev/null | awk '{print $5, $9}' || true
        echo ""
        echo "Selected packages: $(grep '^CONFIG_PACKAGE_.*=y' .config | wc -l)"
        if [ -x staging_dir/host/bin/ccache ]; then
          CCACHE_DIR="$PWD/.ccache" staging_dir/host/bin/ccache -s
          echo ""
          echo "Persistent cache sizes:"
          du -sh ../cache/dl ../cache/ccache ../cache/npm 2>/dev/null || true
        else
          echo "::warning::OpenWrt ccache binary missing; compiler caching was not built (often secondary when an earlier build step failed)"
        fi
        if [ -s build-time.log ]; then
          echo ""
          echo "Build-time report (top 30 packages):"
          perl scripts/build-time-report.pl -n 30 build-time.log || true
        else
          echo "No OpenWrt build-time log was produced"
        fi
        cat feeds.conf

    - name: Upload build failure diagnostics
      if: ${{ always() && steps.build.outcome == 'failure' }}
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-build-diagnostics-${{ github.run_id }}
        path: |
          openwrt-build.log
          libubox-host-clean.log
          libubox-host-diagnostic.log
        if-no-files-found: warn
        retention-days: 14

    - name: Collect artifacts
      run: |
        set -euo pipefail
        d=openwrt/bin/targets/$TARGET/$SUBTARGET
        mkdir out

        # Require one sysupgrade and one initramfs image for every SKU.
        shopt -s nullglob
        for sku in $SKUS; do
          sysupgrade=( "$d"/*-jidu"$sku"-*sysupgrade* )
          initramfs=( "$d"/*-jidu"$sku"-*initramfs* )
          if [ "${#sysupgrade[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one JIDU${sku} sysupgrade image; found ${#sysupgrade[@]}"
            exit 1
          fi
          if [ "${#initramfs[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one JIDU${sku} initramfs image; found ${#initramfs[@]}"
            exit 1
          fi
          cp "${sysupgrade[0]}" "${initramfs[0]}" out/
        done

        # Keep build configuration and package manifests for post-build auditing.
        find "$d" -maxdepth 1 -type f \
          \( -name '*.manifest' -o -name 'config.buildinfo' -o -name 'feeds.buildinfo' -o -name 'version.buildinfo' -o -name 'profiles.json' \) \
          -exec cp {} out/ \;

        # Verify every requested extra package actually reached the image manifest.
        manifest=( "$d"/*.manifest )
        if [ "${#manifest[@]}" -ne 1 ] || [ ! -s "${manifest[0]}" ]; then
          echo "::error::Expected exactly one non-empty target package manifest"
          exit 1
        fi
        while read -r pkg _; do
          case "$pkg" in
            ""|\#*) continue ;;
            -*) continue ;;
          esac
          if ! grep -Eq "^${pkg} - " "${manifest[0]}"; then
            echo "::error::Extra package missing from image manifest: $pkg"
            exit 1
          fi
        done < config/extra-packages.txt

        # Check the legacy tar directory expected by the currently installed JIDU6J11 image.
        jidu6611=( "$d"/*-jidu6611-*sysupgrade* )
        tar -tf "${jidu6611[0]}" | grep -qx "sysupgrade-jiorouter_ax6000-jidu6j11/CONTROL"
        tar -xOf "${jidu6611[0]}" sysupgrade-jiorouter_ax6000-jidu6j11/CONTROL | grep -qx "BOARD=jiorouter_ax6000-jidu6j11"

        ls -lh out

    - name: Upload experimental build artifacts
      if: github.ref != 'refs/heads/integrate/latest-main-five-patches-qcn-bdf-validated'
      uses: actions/upload-artifact@v4
      with:
        name: jidu6j11-remote-ath11k-experiment-${{ github.run_id }}
        path: out/*
        if-no-files-found: error
        retention-days: 14

    - name: Publish release
      if: github.ref == 'refs/heads/integrate/latest-main-five-patches-qcn-bdf-validated'
      env:
        GH_TOKEN: ${{ github.token }}
        HASH: ${{ needs.check.outputs.hash }}
      run: |
        bash scripts/gen-release-notes.sh out > release-notes.md
        (cd out && sha256sum * > sha256sums)
        tag="snapshot-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
        gh release create "$tag" out/* \
          --title "Snapshot $(date -u +%Y-%m-%d) (run ${GITHUB_RUN_NUMBER})" \
          --notes-file release-notes.md
        gh release list --limit 100 --json tagName -q '.[].tagName' \
          | grep '^snapshot-' | sort -r | tail -n +"$((KEEP_RELEASES + 1))" \
          | xargs -r -I{} gh release delete {} --yes --cleanup-tag
